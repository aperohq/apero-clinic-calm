name: Backup freshness monitor
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_production-backup.yml
    with:
      mode: freshness
    secrets: inherit
