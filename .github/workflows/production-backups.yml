name: Production database backups
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_production-backup.yml
    with:
      mode: database
    secrets: inherit
